[package]
name = "ors-scorer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Scores open-rating-engine scoring plans over HTTP or from the command line"
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
ort = "=2.0.0-rc.9"
# ort does not pin its -sys crate; newer ones need a newer Rust and a different ONNX Runtime.
ort-sys = "=2.0.0-rc.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
